<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <title>GYM VIBES - Gym Radio</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="loading">


    <!-- ==========================================
         APPLICATION
    =========================================== -->

    <div id="app" class="app">


        <!-- ======================================
             BACKGROUND
        ======================================= -->

        <div class="background">

            <img
                id="backgroundImage"
                src="images/gym-01.jpg"
                alt="Gym Background"
            >

            <div class="background-overlay"></div>

        </div>


        <!-- ======================================
             HEADER
        ======================================= -->

        <header class="header">


            <!-- BRAND -->

            <div class="brand">

                <div class="brand-icon">
                    ⚡
                </div>

                <div class="brand-text">

                    <div class="brand-name">
                        GYM <span>VIBES</span>
                    </div>

                    <div class="brand-tagline">
                        TRAIN · SWEAT · REPEAT
                    </div>

                </div>

            </div>


            <!-- HEADER RIGHT -->

            <div class="header-right">


                <!-- LIVE -->

                <div class="live-radio">

                    <span class="live-dot"></span>

                    <span>
                        LIVE GYM RADIO
                    </span>

                </div>


                <!-- VIBE -->

                <div class="header-vibe">

                    <label for="moodSelect">
                        VIBE
                    </label>

                    <select
                        id="moodSelect"
                        class="mood-select"
                    >

                        <option value="energetic">
                            Energetic
                        </option>

                        <option value="hindi">
                            Hindi
                        </option>

                        <option value="english">
                            English Workout
                        </option>

                        <option value="sad">
                            Sad Hindi
                        </option>

                        <option value="romantic">
                            Hindi Romantic
                        </option>

                        <option value="marathi">
                            Marathi
                        </option>

                    </select>

                </div>

            </div>

        </header>


        <!-- ======================================
             MAIN CONTENT
        ======================================= -->

        <main class="main-content">


            <!-- EQUALIZER -->

            <div
                id="equalizer"
                class="equalizer paused"
            >

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

                <span></span>

            </div>


            <div class="now-playing-label">
                NOW PLAYING
            </div>


            <h1 id="mainTitle">
                ENERGETIC WORKOUT
            </h1>


            <div
                id="songTitle"
                class="song-title"
            >
                Ready to play
            </div>


            <div class="current-vibe">

                <span>
                    CURRENT VIBE
                </span>

                <strong id="currentVibe">
                    ENERGETIC
                </strong>

            </div>


            <!-- ==================================
                 PLAYER
            =================================== -->

            <div class="player-container">


                <!-- TIME -->

                <div class="progress-row">

                    <span
                        id="currentTime"
                        class="time"
                    >
                        0:00
                    </span>


                    <input
                        type="range"
                        id="progressBar"
                        class="progress-bar"
                        min="0"
                        max="100"
                        value="0"
                        step="0.1"
                    >


                    <span
                        id="duration"
                        class="time"
                    >
                        0:00
                    </span>

                </div>


                <!-- CONTROLS -->

                <div class="controls">


                    <button
                        id="previousButton"
                        class="control-button"
                        type="button"
                        title="Previous Song"
                        aria-label="Previous Song"
                    >
                        <span>⏮</span>
                    </button>


                    <button
                        id="playButton"
                        class="play-button"
                        type="button"
                        title="Play"
                        aria-label="Play"
                    >

                        <span id="playIcon">
                            ▶
                        </span>

                    </button>


                    <button
                        id="nextButton"
                        class="control-button"
                        type="button"
                        title="Next Song"
                        aria-label="Next Song"
                    >
                        <span>⏭</span>
                    </button>

                </div>


            </div>

        </main>


        <!-- ======================================
             FULLSCREEN
        ======================================= -->

        <button
            id="fullscreenButton"
            class="fullscreen-button"
            type="button"
            title="Fullscreen"
            aria-label="Fullscreen"
        >
            ⛶
        </button>


        <!-- ======================================
             HIDDEN YOUTUBE PLAYER
        ======================================= -->

        <div
            id="youtubePlayer"
            class="youtube-player"
        ></div>


    </div>


    <!-- ==========================================
         YOUTUBE IFRAME API
    =========================================== -->

    <script src="https://www.youtube.com/iframe_api"></script>


    <!-- ==========================================
         APPLICATION JS

         IMPORTANT:
         File name is app.js
    =========================================== -->

    <script src="app.js"></script>


</body>

</html>
